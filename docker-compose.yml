version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enercheck
      POSTGRES_PASSWORD: enercheck
      POSTGRES_DB: enercheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enercheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      # Vouchers de transferencia: NO se sirven como estático (ver rifas.py)
      - privado_data:/app/privado
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Portal de administración
  # En desarrollo el portal corre con `npm run dev` (frontend/, puerto 3000, recarga en caliente).
  # Este contenedor (build + nginx, como producción) solo se levanta a pedido:
  #   docker-compose --profile contenedor up --build -d frontend
  frontend:
    profiles: ["contenedor"]
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Landing pública: aplicación aparte del portal. En localhost muestra el sitio de SITIO_POR_DEFECTO
  # (backend/.env); en producción, el del condominio dueño del dominio.
  landing:
    build: ./landing
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  privado_data:
