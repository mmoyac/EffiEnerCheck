# Servidor de la landing en producción (landing/Dockerfile.prod). Sistema de archivos de solo lectura.
# Las cabeceras de seguridad y el enrutamiento de /api/v1/sitio los pone el nginx_proxy del VPS.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: caché de un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes del sitio (portadas): caché de un día; cambian solo con un despliegue.
    location /sitio/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
