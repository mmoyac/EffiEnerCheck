# Servidor de la landing en producción (landing/Dockerfile.prod). Sistema de archivos de solo lectura.
# Delante solo está Traefik (Dokploy), que termina TLS y enruta por dominio: la lista blanca de la API,
# la redirección www y los encabezados de seguridad (CSP incluida) se aplican aquí.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # IP real del visitante: Traefik reescribe X-Forwarded-For. 10.0.1.0/24 es la red dokploy-network.
    set_real_ip_from 10.0.1.0/24;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/seguridad.conf;

    # Chequeo de salud del contenedor (antes de la redirección: lo consulta Docker por 127.0.0.1).
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # www.<dominio> → <dominio>, para cualquier condominio sin escribir su dominio aquí.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $enercheck_api "enercheck_backend:8000";

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;   # el backend resuelve el condominio por este dominio
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;

    # Lo único de la API que ve la landing: su contenido y los logos de los condominios.
    location = /api/v1/sitio {
        limit_except GET { deny all; }
        proxy_pass http://$enercheck_api;
    }

    location /uploads/condominios/ {
        limit_except GET { deny all; }
        proxy_pass http://$enercheck_api;
    }

    location /api/ {
        return 404;
    }

    location /uploads/ {
        return 404;
    }

    # Archivos con hash en el nombre: caché de un año.
    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes del sitio (portadas): caché de un día; cambian solo con un despliegue.
    location /sitio/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
