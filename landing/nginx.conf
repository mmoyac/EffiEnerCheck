# Landing en DESARROLLO. Reenvía al backend SOLO lo que la landing usa; el resto de la API no existe
# para este sitio (igual que en producción, donde lo restringe infra/nginx/condominiosantalaura-landing.conf).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Misma política que el vhost de producción: si algo de la landing la rompe, se ve en desarrollo
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /api/v1/sitio {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
  }

  location /uploads/condominios/ {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
