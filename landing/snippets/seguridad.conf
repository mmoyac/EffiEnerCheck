# Encabezados de seguridad de la landing. Se incluye en el server y en cada location que define su propio
# add_header: en nginx, un add_header dentro de un location anula todos los heredados del server.
# HSTS sin includeSubDomains: el dominio es del condominio y no controlamos sus otros subdominios.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
# Nada de terceros: scripts, estilos, fuentes e imágenes solo del mismo origen.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
