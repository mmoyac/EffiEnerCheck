# Encabezados de seguridad del portal. Se incluye en el server y en cada location que define su propio
# add_header: en nginx, un add_header dentro de un location anula todos los heredados del server.
# HSTS sin includeSubDomains: el dominio puede ser del condominio y no controlamos sus otros subdominios.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Cámara: el lector fotografía los remarcadores y la portería los vouchers.
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
