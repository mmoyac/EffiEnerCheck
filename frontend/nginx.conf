server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API al backend
  # Manifiesto de la app: lo arma la API con el nombre y el color del condominio del dominio
  location = /manifest.webmanifest {
    proxy_pass http://backend:8000/api/v1/portal/manifest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Imágenes subidas (boletas, logos de condominios): las sirve el backend (igual en frontend/nginx.prod.conf).
  location /uploads/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
