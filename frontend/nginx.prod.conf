# Servidor del portal en producción (frontend/Dockerfile.prod). Sistema de archivos de solo lectura.
# Delante solo está Traefik (Dokploy), que termina TLS y enruta por dominio: el enrutamiento de /api/ y
# /uploads/ al backend, el límite de intentos de login y los encabezados de seguridad se aplican aquí.

# Login y enlaces de acceso: 10 por minuto por IP (ráfaga de 5). Este archivo se incluye en el contexto http.
limit_req_zone $binary_remote_addr zone=enercheck_auth:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # IP real del visitante: Traefik reescribe X-Forwarded-For (no confía en el que trae el cliente).
    # 10.0.1.0/24 es la red dokploy-network, por donde llega Traefik.
    set_real_ip_from 10.0.1.0/24;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/seguridad.conf;

    # El backend se resuelve en cada petición (DNS de Docker): nginx arranca aunque la API aún no esté.
    # Nombre de contenedor, no de servicio: dokploy-network la comparten otros proyectos.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $enercheck_api "enercheck_backend:8000";

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    # Chequeo de salud del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/token {
        limit_req zone=enercheck_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$enercheck_api;
    }

    # Recuperación y enlaces de acceso: públicos, con el mismo límite por IP que el login
    location ~ ^/api/v1/auth/(recuperar|verificar-enlace|establecer-clave)$ {
        limit_req zone=enercheck_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$enercheck_api;
    }

    location /api/ {
        client_max_body_size 12m;   # fotos de boletas y vouchers de transferencia (hasta 10 MB)
        proxy_read_timeout   120s;  # el OCR con Gemini puede tardar
        proxy_pass http://$enercheck_api;
    }

    location /uploads/ {
        proxy_pass http://$enercheck_api;
    }

    # Archivos con hash en el nombre: caché de un año.
    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker, su registro y el manifiesto: siempre se revalidan, para que la PWA se actualice.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta interna (/boletas/3, /mis-rifas, …) sirve el index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
