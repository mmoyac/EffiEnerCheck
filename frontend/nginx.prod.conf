# Servidor de la SPA de EnerCheck en producción (frontend/Dockerfile.prod).
# El contenedor corre con el sistema de archivos de solo lectura. Las cabeceras de seguridad y el
# enrutamiento de /api/ y /uploads/ los pone el nginx_proxy del VPS (infra/nginx/enercheck.conf).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Chequeo de salud del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: caché de un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker, su registro y el manifiesto: siempre se revalidan, para que la PWA se actualice.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta interna (/boletas/3, /mis-rifas, …) sirve el index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
