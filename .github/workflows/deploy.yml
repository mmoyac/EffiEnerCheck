# EnerCheck — CI/CD (ver DEPLOY.md).
#
#   push a develop / pull request  → solo los chequeos (backend + frontend)
#   push a main                    → chequeos → aprobación del environment "production" → build → Trivy →
#                                    push a Docker Hub → respaldo → deploy en Dokploy → espera sano
#
# El VPS nunca construye imágenes: Dokploy solo descarga las que publica este pipeline.
# El repositorio es público: permisos mínimos, actions fijadas por SHA, sin pull_request_target y los
# secretos solo en el environment "production":
#   DOCKER_USERNAME, DOCKER_PASSWORD          Docker Hub (token de acceso, no la contraseña)
#   VPS_HOST, VPS_PORT, VPS_SSH_KEY           llave con comando forzado (infra/servidor/enercheck-ci)
#   VPS_KNOWN_HOSTS                           huella del servidor (ssh-keyscan), sin confiar a ciegas
#   DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_COMPOSE_ID
# Los logs son públicos: ningún paso imprime secretos. Los secretos de la aplicación viven en el
# Environment del proyecto en Dokploy, nunca aquí.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # un deploy a producción nunca se cancela

jobs:
  backend:
    name: checks · backend
    runs-on: ubuntu-24.04   # fijo: la misma versión del VPS; ubuntu-latest cambia sin aviso
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enercheck
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: enercheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enercheck" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Base desechable del job: valores de CI, no son secretos.
      DATABASE_URL: postgresql+asyncpg://enercheck:ci-postgres@localhost:5432/enercheck
      SECRET_KEY: ci-secreto-desechable-de-integracion-continua
      ENTORNO: desarrollo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Carpetas de archivos (main.py monta /app/uploads, igual que en el contenedor)
        run: sudo mkdir -p /app/uploads /app/privado && sudo chown -R "$(id -u):$(id -g)" /app

      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit

      - name: Migraciones + catálogos + datos de desarrollo (1.ª vez, base vacía)
        run: python -m app.arranque && python -m app.db.seeds.seeder

      - name: Preparación repetida (migraciones y seeds deben ser idempotentes)
        run: python -m app.arranque && python -m app.db.seeds.seeder

      - name: Pruebas
        run: python -m pytest -q

      - name: La aplicación importa
        run: python -c "import main"

      - name: Vulnerabilidades en dependencias (excepciones en security/pip-audit-ignore.txt)
        run: |
          IGNORAR=()
          while read -r id _; do IGNORAR+=(--ignore-vuln "$id"); done < <(grep -Ev '^[[:space:]]*(#|$)' ../security/pip-audit-ignore.txt || true)
          pip-audit -r requirements.txt "${IGNORAR[@]}"

  frontends:
    name: checks · ${{ matrix.app }}
    runs-on: ubuntu-24.04   # fijo: la misma versión del VPS; ubuntu-latest cambia sin aviso
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, landing]   # portal y landing: aplicaciones separadas, mismos chequeos
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci --no-fund

      - name: Vulnerabilidades en dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Build (incluye tsc)
        run: npm run build

  build-and-deploy:
    name: build + deploy (producción)
    needs: [backend, frontends]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04   # fijo: la misma versión del VPS; ubuntu-latest cambia sin aviso
    timeout-minutes: 30
    environment: production        # aprobación manual; solo este job recibe los secretos
    env:
      REGISTRO: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}   # token de acceso de Docker Hub, no la contraseña

      # ---- 1. Build (local, sin publicar todavía) -------------------------------------------------------
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          load: true
          tags: ${{ env.REGISTRO }}/enercheck-backend:latest,${{ env.REGISTRO }}/enercheck-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          load: true
          tags: ${{ env.REGISTRO }}/enercheck-frontend:latest,${{ env.REGISTRO }}/enercheck-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build landing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: landing
          file: landing/Dockerfile.prod
          load: true
          tags: ${{ env.REGISTRO }}/enercheck-landing:latest,${{ env.REGISTRO }}/enercheck-landing:${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

      # ---- 2. Escaneo: una vulnerabilidad CRÍTICA con parche detiene el deploy (excepciones en .trivyignore) --
      - name: Trivy backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/enercheck-backend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/enercheck-frontend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Trivy landing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/enercheck-landing:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # ---- 3. Publicar (latest + SHA para rollback) ------------------------------------------------------
      - name: Push de las 3 imágenes
        run: |
          for c in backend frontend landing; do
            docker push "$REGISTRO/enercheck-$c:${GITHUB_SHA}"
            docker push "$REGISTRO/enercheck-$c:latest"
          done

      # ---- 4. Deploy con Dokploy: respaldo previo → compose fijado al commit → deploy → espera sano ---------
      # El VPS nunca construye: Dokploy solo descarga las imágenes publicadas arriba. Como su deploy hace
      # `up -d` sin pull, el compose se envía con las imágenes fijadas a este commit (${TAG:-<sha>}).
      # El SSH usa una llave con comando forzado (infra/servidor/enercheck-ci): solo puede respaldar y
      # consultar la salud; no abre una shell.
      - name: Compose fijado al commit
        run: |
          sed "s/:\${TAG:-latest}/:\${TAG:-${GITHUB_SHA}}/g" docker-compose.prod.yml > compose.deploy.yml
          n=$(grep -c ":\${TAG:-${GITHUB_SHA}}" compose.deploy.yml)
          if [ "$n" -ne 3 ]; then echo "Se esperaban 3 imágenes fijadas al commit y hay $n"; exit 1; fi

      - name: Acceso SSH (llave con comando forzado)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/enercheck_ci
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/enercheck_ci ~/.ssh/known_hosts

      - name: Respaldo previo (base + archivos + compose vigente)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: ssh -i ~/.ssh/enercheck_ci -p "$VPS_PORT" -o BatchMode=yes "root@$VPS_HOST" "respaldar $GITHUB_SHA"

      # Las respuestas de la API de Dokploy traen el Environment del proyecto (secretos): nunca se imprimen.
      - name: Deploy en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          llamar() {
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
              -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' \
              --data-binary @- "$DOKPLOY_URL/api/$1")
            if [ "$codigo" != 200 ]; then echo "Dokploy $1 respondió HTTP $codigo"; exit 1; fi
            echo "Dokploy $1: OK"
          }
          jq -n --arg id "$DOKPLOY_COMPOSE_ID" --rawfile archivo compose.deploy.yml \
            '{composeId: $id, composeFile: $archivo, sourceType: "raw"}' | llamar compose.update
          jq -n --arg id "$DOKPLOY_COMPOSE_ID" '{composeId: $id}' | llamar compose.deploy

      - name: Espera a que el backend quede sano con este commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: ssh -i ~/.ssh/enercheck_ci -p "$VPS_PORT" -o BatchMode=yes "root@$VPS_HOST" "esperar-sano $GITHUB_SHA"

      - name: Limpieza de la llave
        if: always()
        run: rm -f ~/.ssh/enercheck_ci
