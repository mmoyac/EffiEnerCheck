# EnerCheck — PRODUCCIÓN en el VPS con Dokploy (comunidadsantalaura.cl). Ver DEPLOY.md.
#
# Dokploy lo ejecuta como compose "raw": el pipeline sube este archivo con compose.update, reemplazando
# ${TAG:-latest} por ${TAG:-<sha del commit>}, y luego llama a compose.deploy. Dokploy hace
# `docker compose up -d` SIN pull: por eso las imágenes van fijadas al commit y nunca a latest.
# El .env (secretos) es el Environment del proyecto en Dokploy; nunca viaja por el pipeline.
# Rollback:  en Dokploy, Environment → TAG=<sha anterior> → Deploy. Se vuelve al flujo normal borrando TAG.
# Dominios y TLS: pestaña Domains de Dokploy (Traefik + Let's Encrypt), no aquí.
#
# ⚠️ En tu PC, pruébalo SIEMPRE con otro nombre de proyecto (-p enercheck_prodlocal): "enercheck" es
# también el proyecto del docker-compose.yml de desarrollo, y sin -p reemplaza sus contenedores.
#
# Aislamiento: todo con prefijo enercheck y ningún puerto publicado. Backend, portal y landing van a
# dokploy-network (externa, la crea Dokploy), por donde los alcanza Traefik y por donde el backend sale
# a Gemini. La base queda en la red interna, sin salida a internet.
name: enercheck

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    container_name: enercheck_db
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]   # la imagen oficial necesita sus capacidades para initdb
    environment:
      POSTGRES_USER: enercheck
      POSTGRES_DB: enercheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      TZ: America/Santiago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enercheck -d enercheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]
    mem_limit: 512m
    cpus: 1.0

  backend:
    <<: *app
    image: ${DOCKER_USERNAME:?falta DOCKER_USERNAME}/enercheck-backend:${TAG:-latest}
    container_name: enercheck_backend
    env_file: .env
    environment:
      # POSTGRES_PASSWORD sale de secrets.token_urlsafe: solo [A-Za-z0-9_-], seguro dentro de la URL.
      DATABASE_URL: postgresql+asyncpg://enercheck:${POSTGRES_PASSWORD}@enercheck_db:5432/enercheck
      ENTORNO: produccion
      TZ: America/Santiago
    volumes:
      - uploads:/app/uploads     # imágenes de boletas (se sirven en /uploads/)
      - privado:/app/privado     # vouchers de transferencia (NUNCA estáticos; ver rifas.py)
    depends_on:
      db: { condition: service_healthy }
    networks: [interna, dokploy-network]
    mem_limit: 768m
    cpus: 1.0

  frontend:
    <<: *app
    image: ${DOCKER_USERNAME}/enercheck-frontend:${TAG:-latest}
    container_name: enercheck_frontend
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [dokploy-network]
    mem_limit: 64m
    cpus: 0.25

  # Landing pública del condominio: aplicación aparte del portal, con su dominio propio
  # (dominio en Dokploy; reglas en landing/nginx.prod.conf). Si se detiene, el portal y la API siguen igual.
  landing:
    <<: *app
    image: ${DOCKER_USERNAME}/enercheck-landing:${TAG:-latest}
    container_name: enercheck_landing
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    networks: [dokploy-network]
    mem_limit: 64m
    cpus: 0.25

networks:
  interna:
    name: enercheck_interna
    internal: true          # sin salida a internet: solo db y backend
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  pgdata:
    name: enercheck_pgdata
  uploads:
    name: enercheck_uploads
  privado:
    name: enercheck_privado
