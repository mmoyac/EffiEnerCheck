# Portal de administración de Santa Laura en su dominio propio: portal.condominiosantalaura.cl.
# Es el mismo portal que enercheck-santalaura.effi4tech.cl (contenedores enercheck_frontend y
# enercheck_backend); solo cambian el server_name y el certificado. La zona enercheck_auth la declara
# enercheck.conf: este archivo la reutiliza y NO debe redeclararla (el proxy es compartido).
#
# Instalar en el VPS junto con enercheck.conf (DEPLOY.md §11):
#   cp condominiosantalaura-portal.conf /root/docker/nginx-proxy/conf.d/
#   docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload

server {
    listen 80;
    server_name portal.condominiosantalaura.cl;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.condominiosantalaura.cl;
    server_tokens off;

    # Certificado de condominiosantalaura.cl (cubre el dominio, www y portal; DEPLOY.md §11).
    ssl_certificate     /etc/letsencrypt/live/condominiosantalaura.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condominiosantalaura.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad. Ningún location define add_header propio, así que todos las heredan.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El lector y la portería suben fotos (boletas, vouchers) con la cámara; nadie usa ubicación ni micrófono.
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # Resolución dinámica con el DNS de Docker: con `set $var` + variable en proxy_pass, nginx vuelve a
    # resolver cada 10 s, así que un contenedor recreado por un deploy (IP nueva) no deja un 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $enercheck_api      "enercheck_backend:8000";
    set $enercheck_frontend "enercheck_frontend:8080";

    # Comunes a todos los location (ninguno redefine proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    # ---- Login: límite por IP (zona enercheck_auth) ------------------------------------------------------
    location = /api/v1/auth/token {
        limit_req zone=enercheck_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$enercheck_api;
    }

    # ---- API ----------------------------------------------------------------------------------------------
    location /api/ {
        client_max_body_size 12m;   # fotos de boletas y vouchers de transferencia (hasta 10 MB)
        proxy_read_timeout   120s;  # el OCR con Gemini puede tardar
        proxy_pass http://$enercheck_api;
    }

    # ---- Imágenes de boletas (estático del backend). Los vouchers NO pasan por aquí ----------------------
    location /uploads/ {
        proxy_pass http://$enercheck_api;
    }

    # ---- SPA ----------------------------------------------------------------------------------------------
    location / {
        proxy_pass http://$enercheck_frontend;
    }
}
