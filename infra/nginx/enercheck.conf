# EnerCheck — vhost del nginx_proxy compartido del VPS: enercheck-santalaura.effi4tech.cl
# Termina TLS con el wildcard *.effi4tech.cl y enruta /api/ y /uploads/ al backend y el resto al frontend.
# Los contenedores de EnerCheck no manejan TLS.
#
# Instalar en el VPS (el pipeline NO copia archivos; ver DEPLOY.md §5):
#   cp enercheck.conf /root/docker/nginx-proxy/conf.d/enercheck.conf
#   docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
#
# Todo lo que vive en el nivel http (zonas, map) lleva el prefijo enercheck_: el proxy es compartido.

# Freno a fuerza bruta contra el login: 10 intentos por minuto por IP + ráfaga de 5.
limit_req_zone $binary_remote_addr zone=enercheck_auth:10m rate=10r/m;

server {
    listen 80;
    server_name enercheck-santalaura.effi4tech.cl;
    server_tokens off;

    # Renovación de certificados (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name enercheck-santalaura.effi4tech.cl;
    server_tokens off;

    # Wildcard *.effi4tech.cl (cert compartido effi4tech.cl-0001, lo renueva nginx_certbot).
    ssl_certificate     /etc/letsencrypt/live/effi4tech.cl-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/effi4tech.cl-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad. Ningún location define add_header propio, así que todos las heredan.
    # HSTS sin includeSubDomains ni preload: effi4tech.cl es compartido con otros proyectos.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El lector y la portería suben fotos (boletas, vouchers) con la cámara; nadie usa ubicación ni micrófono.
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # Resolución dinámica con el DNS de Docker: con `set $var` + variable en proxy_pass, nginx vuelve a
    # resolver cada 10 s, así que un contenedor recreado por un deploy (IP nueva) no deja un 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $enercheck_api      "enercheck_backend:8000";
    set $enercheck_frontend "enercheck_frontend:8080";

    # Comunes a todos los location (ninguno redefine proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    # ---- Login: límite por IP (zona enercheck_auth) ------------------------------------------------------
    location = /api/v1/auth/token {
        limit_req zone=enercheck_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$enercheck_api;
    }

    # ---- API ----------------------------------------------------------------------------------------------
    location /api/ {
        client_max_body_size 12m;   # fotos de boletas y vouchers de transferencia (hasta 10 MB)
        proxy_read_timeout   120s;  # el OCR con Gemini puede tardar
        proxy_pass http://$enercheck_api;
    }

    # ---- Imágenes de boletas (estático del backend). Los vouchers NO pasan por aquí ----------------------
    location /uploads/ {
        proxy_pass http://$enercheck_api;
    }

    # ---- SPA ----------------------------------------------------------------------------------------------
    location / {
        proxy_pass http://$enercheck_frontend;
    }
}
