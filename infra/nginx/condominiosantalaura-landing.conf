# Landing pública de Santa Laura: www.condominiosantalaura.cl (y el dominio sin www, que redirige).
# Aplicación aparte del portal (contenedor enercheck_landing). Del backend solo expone lo que la landing
# usa: GET /api/v1/sitio y los logos de /uploads/condominios/. Ni el login ni el resto de la API.
#
# Certificado: uno solo para condominiosantalaura.cl, www y portal (DEPLOY.md §11).
# Instalar en el VPS (el pipeline NO copia archivos):
#   cp condominiosantalaura-landing.conf /root/docker/nginx-proxy/conf.d/
#   docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload

server {
    listen 80;
    server_name condominiosantalaura.cl www.condominiosantalaura.cl;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.condominiosantalaura.cl$request_uri;
    }
}

# Dominio sin www → www (un solo origen para buscadores y enlaces compartidos)
server {
    listen 443 ssl;
    http2 on;
    server_name condominiosantalaura.cl;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/condominiosantalaura.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condominiosantalaura.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://www.condominiosantalaura.cl$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.condominiosantalaura.cl;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/condominiosantalaura.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condominiosantalaura.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad (ningún location define add_header propio, así que todos las heredan).
    # La landing no ejecuta nada de terceros: todo sale de este origen.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $enercheck_api     "enercheck_backend:8000";
    set $enercheck_landing "enercheck_landing:8080";

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;   # el backend resuelve el condominio por este dominio
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;

    # ---- Contenido del sitio (único endpoint de la API visible desde este dominio) -------------------------
    location = /api/v1/sitio {
        limit_except GET { deny all; }
        proxy_pass http://$enercheck_api;
    }

    # ---- Logos de los condominios (públicos) ---------------------------------------------------------------
    location /uploads/condominios/ {
        limit_except GET { deny all; }
        proxy_pass http://$enercheck_api;
    }

    # ---- Todo lo demás de la API: no existe para la landing ------------------------------------------------
    location /api/ {
        return 404;
    }
    location /uploads/ {
        return 404;
    }

    # ---- Landing -------------------------------------------------------------------------------------------
    location / {
        proxy_pass http://$enercheck_landing;
    }
}
